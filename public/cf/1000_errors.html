<title>无法打开此页面 · Lumen</title>
<style>:root{
  color-scheme:light dark;
  --bg:#f4f4f5;--surface:#fff;--ink:#18181b;--muted:#71717a;--faint:#a1a1aa;
  --border:#e1e1e4;--meta:#82828b;--accent:#0485f7;--accent-hover:#0374d9;--on-accent:#fff;
  --glow:rgba(4,133,247,.10);--star:0 0 0;--star-alpha:.18;--ring:rgba(24,24,27,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#050506;--surface:#151518;--ink:#f4f4f5;--muted:#a1a1aa;--faint:#71717a;
    --border:#26262a;--meta:#6e6e77;--accent-hover:#2b97f8;
    --glow:rgba(4,133,247,.20);--star:255 255 255;--star-alpha:.55;--ring:rgba(255,255,255,.06);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);
  background:radial-gradient(ellipse 70% 45% at 50% -8%,var(--glow),transparent 70%),var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--star-alpha);
  background-image:
    radial-gradient(1px 1px at 12% 18%,rgb(var(--star)/.7),transparent),
    radial-gradient(1px 1px at 34% 62%,rgb(var(--star)/.45),transparent),
    radial-gradient(1px 1px at 58% 14%,rgb(var(--star)/.6),transparent),
    radial-gradient(1px 1px at 76% 70%,rgb(var(--star)/.4),transparent),
    radial-gradient(1px 1px at 88% 12%,rgb(var(--star)/.55),transparent),
    radial-gradient(1px 1px at 22% 84%,rgb(var(--star)/.35),transparent),
    radial-gradient(1px 1px at 66% 88%,rgb(var(--star)/.45),transparent),
    radial-gradient(1px 1px at 8% 46%,rgb(var(--star)/.4),transparent),
    radial-gradient(1px 1px at 94% 44%,rgb(var(--star)/.5),transparent),
    radial-gradient(1.5px 1.5px at 42% 30%,rgb(var(--star)/.5),transparent);
}
a{color:inherit}
.page{position:relative;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:0 16px}
.top{display:flex;align-items:center;height:64px;max-width:1120px;width:100%;margin:0 auto}
.top a{display:inline-flex;color:var(--ink);text-decoration:none;border-radius:6px}
.logo{display:block;height:20px;width:auto}
.main{
  position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;width:100%;max-width:440px;margin:0 auto;padding:24px 0 96px;
}
.mark{
  position:relative;display:grid;place-items:center;width:52px;height:52px;margin-bottom:40px;
  border-radius:16px;background:var(--surface);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--border),0 1px 2px rgba(0,0,0,.04),0 0 0 8px var(--ring),0 0 0 18px color-mix(in srgb,var(--ring) 45%,transparent);
}
.mark svg{width:24px;height:24px}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
h1.title{margin:0;font-size:28px;line-height:1.25;font-weight:600;letter-spacing:.01em}
.lead{margin:12px 0 0;font-size:15px;line-height:1.7;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:28px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 20px;border-radius:999px;
  font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;
  transition:background-color .15s,box-shadow .15s,color .15s;
}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--border)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.btn:focus-visible,.top a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.details{width:100%;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
/* Cloudflare 的详情框：英文标题与原因说明不给用户看，只留 Ray ID / IP / 错误号 / 节点几项，排障时报给客服 */
.cf-error-details h1,.cf-error-details h2,.cf-error-details p{display:none}
.cf-error-details ul,.meta{
  list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;
  font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--meta);
}
.cf-error-details li,.meta li{margin:0;word-break:break-all}
.challenge{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:28px;font-size:14px;line-height:1.6;color:var(--muted)}
.challenge a{color:var(--accent)}
@media (max-width:480px){
  .main{padding-bottom:64px}
  h1.title{font-size:24px}
  .lead{font-size:14px}
}</style>
